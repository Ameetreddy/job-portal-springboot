<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Recruiter Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.css}"/>

    <style>
        .dashboard-container { max-width: 900px; margin: 30px auto; padding: 0 15px; }
        .job-card { background: #fff; border-radius: 10px; padding: 18px 22px; border: 1px solid #e5e5e5; transition: all 0.2s ease; }
        .job-card:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); transform: translateY(-2px); }
        .job-title { font-size: 18px; font-weight: 600; }
        .company-name { font-size: 14px; color: #6c757d; margin-top: 2px; }
        .candidate-badge { background: #0d6efd; color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 500; white-space: nowrap; }
        .delete-form { display: inline-block; margin-left: 10px; }
    </style>
</head>
<body>

<header class="navbar navbar-expand-lg navbar-dark" fixed-top>
    <label class="mt-2 ms-5 font-weight-bold h5">
        <a th:href="@{/dashboard/recruiter}">Jobportal</a>
        <span class="logo_com font-weight-bold h5" style="color:white">.com</span>
    </label>

    <div class="collapse navbar-collapse">
        <ul class="navbar-nav m-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/dashboard/add}"><i class="fa-solid fa-file-circle-plus"></i> Post New Job</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/dashboard/recruiter}"><i class="fa-solid fa-eye"></i> View Your Jobs</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/recruiter-profile/}"><i class="fa-solid fa-pencil"></i> Edit Account</a></li>
        </ul>

        <img class="rounded-circle me-2" height="40" width="40"
             th:if="${user != null && user.photoImagePath != null}"
             th:src="@{${user.photoImagePath}}"/>
        <label class="nav-link me-3 text-light"
               th:text="${user != null && user.firstName != null ? user.firstName + ' ' + user.lastName : username}">
        </label>

        <button class="myBtn-light me-5" onclick="window.location.href='/logout'">Logout</button>
    </div>
</header>

<div class="dashboard-container">

    <div class="mb-4 ps-3 border-start border-4 border-primary">
        <h4 class="fw-bold mb-1">Recruiter Dashboard</h4>
        <p class="text-muted mb-0">Manage your job posts and track applications</p>
    </div>

    <th:block th:each="jobPost : ${jobPost}">
        <a th:href="@{/dashboard/recruiter/job-post/{id}/applications(id=${jobPost.jobPostId})}" class="text-decoration-none text-dark">
            <div class="job-card mb-3">
                <div class="d-flex justify-content-between align-items-center">

                    <div>
                        <div class="job-title" th:text="${jobPost.jobTitle}"></div>
                        <div class="company-name" th:text="${jobPost.jobCompanyId.name}"></div>
                    </div>

                    <div class="d-flex align-items-center">
                        <div class="candidate-badge me-2">
                            <i class="fa-solid fa-users me-1"></i>
                            <span th:text="${jobPost.totalCandidates}"></span> Applied
                        </div>

                        <form class="delete-form"
                              th:action="@{/dashboard/recruiter/deleteJob}" 
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this job?')">
                            <input type="hidden" name="id" th:value="${jobPost.jobPostId}" />
                            <button type="submit" class="btn btn-danger btn-sm">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </a>
    </th:block>

    <th:block th:if="${#lists.isEmpty(jobPost)}">
        <div class="text-center mt-5 text-muted">
            <i class="fa-regular fa-folder-open fa-2x mb-2"></i>
            <p>No jobs posted yet.</p>
        </div>
    </th:block>

</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
