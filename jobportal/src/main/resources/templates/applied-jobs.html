<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Applied Jobs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>

    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.css}"/>
</head>

<body>

<header class="navbar navbar-expand-lg navbar-dark">
    <label class="mt-2 ms-5 h5">
        <a href="/">Jobportal</a>
        <span style="color:white">.com</span>
    </label>

    <div class="collapse navbar-collapse">
        <ul class="navbar-nav m-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/dashboard/}">
                    <i class="fas fa-search"></i> Search Jobs
                </a>
            </li>
            <li class="nav-item active">
                <a class="nav-link" th:href="@{/applied-jobs}">
                    <i class="fa-solid fa-eye"></i> Applied Jobs
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/job-seeker-profile/}">
                    <i class="fa-solid fa-pencil"></i> Edit Profile
                </a>
            </li>
        </ul>

		<img class="rounded-circle me-3" height="50px" width="50px"
		             th:if="${user != null && user.photoImagePath != null}" th:src="@{${user.photoImagePath}}"/>

		        <label th:if="${user != null && user.firstName != null && user.lastName != null}"
		               th:text="${user.firstName + ' ' + user.lastName}"
		               class="nav-item nav-link px-2 me-3"></label>

		        <label th:unless="${user != null && user.firstName != null && user.lastName != null}"
		               th:text="${username}"
		               class="nav-item nav-link px-2 me-3"></label>

        <button class="btn btn-outline-light me-4"
                onclick="window.location.href='/logout'">
            Logout
        </button>
    </div>
</header>

<section class="section">
    <article class="container mt-5">

        <h2 class="mb-4">Applied Jobs</h2>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>Job Title</th>
                <th>Location</th>
                <th>Company</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="app : ${appliedList}">
                <td>
                    <a th:href="@{/job-details-apply/{id}(id=${app.job.jobPostId})}"
                       th:text="${app.job.jobTitle}">
                    </a>
                </td>

                <td th:text="${app.job.jobLocationId.city + ', ' + app.job.jobLocationId.state}"></td>

                <td th:text="${app.job.jobCompanyId.name}"></td>

                <td>
                    <span th:text="${app.status}"
                          th:classappend="
                              ${app.status == 'Pending'} ? 'badge bg-warning text-dark' :
                              (${app.status == 'Selected'} ? 'badge bg-success' :
                              'badge bg-danger')">
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(appliedList)}">
                <td colspan="4" class="text-center text-muted">
                    No applied jobs found
                </td>
            </tr>
            </tbody>
        </table>

    </article>
</section>

<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>

</body>
</html>
