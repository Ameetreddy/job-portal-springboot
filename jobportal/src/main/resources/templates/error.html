<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .error-box {
            max-width: 600px;
            margin: 120px auto;
            padding: 30px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            text-align: center;
        }
    </style>
</head>

<body>

<div class="error-box">
    <h2 class="text-danger mb-3"
        th:text="${errorTitle}">
        Error
    </h2>

    <p class="text-muted"
       th:text="${errorMessage}">
        Something went wrong.
    </p>

    <div class="mt-4">
        <a href="javascript:history.back()"
           class="btn btn-outline-secondary me-2">
            Go Back
        </a>

        <a th:href="@{/dashboard/}"
           class="btn btn-primary">
            Dashboard
        </a>
    </div>
</div>

</body>
</html>
